# agentgateway.yaml — Production gateway policy for heretek-context-router (Wave 3).
# Listens on :3000 and routes lazy-broker backend MCP calls to profile-scoped
# targets. CEL RBAC mirrors the broker authorization gate: read-only roles
# (director, qa-adversary) are denied mutating tool calls; the circuit breaker
# state (open 60s after 3 consecutive backend failures) is enforced in-process
# by src/lazy-broker/meta-router-mcp.ts before traffic reaches this gateway.

apiVersion: agentgateway/v1
kind: Gateway
metadata:
  name: heretek-context-router
  tool: heretek-context-router@0.1.0

listeners:
  - name: mcp-ingress
    port: 3000
    protocol: HTTP
    bind: 127.0.0.1

backends:
  - name: heretek-core
    profile: core
    target: http://127.0.0.1:3101/mcp
  - name: ghidra-mcp
    profile: appsec
    target: http://127.0.0.1:3102/mcp
  - name: radare2-mcp
    profile: appsec
    target: http://127.0.0.1:3103/mcp
  - name: rea-mcp
    profile: appsec
    target: http://127.0.0.1:3104/mcp
  - name: adb-mcp
    profile: android
    target: http://127.0.0.1:3105/mcp
  - name: maestro
    profile: android
    target: http://127.0.0.1:3106/mcp
  - name: godot-mcp
    profile: game
    target: http://127.0.0.1:3107/mcp
  - name: blender-mcp
    profile: game
    target: http://127.0.0.1:3108/mcp
  - name: crawl4ai
    profile: research
    target: http://127.0.0.1:3109/mcp
  - name: searxng
    profile: research
    target: http://127.0.0.1:3110/mcp
  - name: computer-use-linux
    profile: research
    target: http://127.0.0.1:3111/mcp

policies:
  - name: deny-readonly-roles-mutating-calls
    description: qa-adversary and director never call mutating backend tools
    cel: >-
      !(request.role in ['qa-adversary', 'director'] && request.tool.mutating)
    action: deny
    onViolation: rejectFailClosed
  - name: allow-known-profiles-only
    description: profile must be one of the five Heretek Compose profiles
    cel: >-
      request.profile in ['core', 'appsec', 'android', 'game', 'research']
    action: allow
    onViolation: rejectFailClosed
  - name: require-registered-backend
    description: route only to backends declared above; unknown servers rejected
    cel: >-
      request.backend in ['heretek-core', 'ghidra-mcp', 'radare2-mcp',
      'rea-mcp', 'adb-mcp', 'maestro', 'godot-mcp', 'blender-mcp',
      'crawl4ai', 'searxng', 'computer-use-linux']
    action: allow
    onViolation: rejectFailClosed
